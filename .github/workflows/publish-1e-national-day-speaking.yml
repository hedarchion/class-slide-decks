name: Publish Class 1E National Day Speaking

on:
  push:
    branches: [codex/publish-supermarket-complaints]
    paths:
      - 'decks/class-1e/2026/week-29/2026-08-20-national-day-speaking/**'
      - '.github/workflows/publish-1e-national-day-speaking.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: decks/class-1e/2026/week-29/2026-08-20-national-day-speaking
      - id: deployment
        uses: actions/deploy-pages@v4
